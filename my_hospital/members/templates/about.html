{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
.about_page {
    background-image: url("{% static 'assets/img/about_bg.jpg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 80px 0;
    position: relative;
    color: white;
}

/* Dark overlay */
.about_page::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75); /* DARK BACKGROUND */
    z-index: 1;
}

.about_content {
    position: relative;
    z-index: 2;
    max-width: 750px;
    margin: auto;
    text-align: center;
}
</style>

<section class="about_page">
    <div class="container about_content">
        <h2>About Docmed Hospital</h2>
        <p style="font-size: 18px; margin-top: 15px;">
            Docmed Hospital is committed to providing the best medical care with experienced doctors,
            modern facilities, and compassionate service.
        </p>
    </div>
</section>

{% endblock %}
