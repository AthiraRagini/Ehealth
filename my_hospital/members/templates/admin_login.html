{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    .admin-login-container {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .admin-login-card {
        background: white;
        border-radius: 20px;
        padding: 40px 35px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        position: relative;
        overflow: hidden;
    }

    .admin-login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    }

    .admin-logo {
        max-height: 60px;
        margin: 0 auto 25px auto;
        display: block;
        transition: transform 0.3s ease;
    }

    .admin-logo:hover {
        transform: scale(1.05);
    }

    .admin-card-title {
        text-align: center;
        color: #333;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 30px;
        position: relative;
        padding-bottom: 15px;
    }

    .admin-card-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        border-radius: 2px;
    }

    .form-label {
        color: #555;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 15px;
        transition: all 0.3s ease;
        background: #f8f9fa;
    }

    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        background: white;
        outline: none;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .btn-admin-login {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        letter-spacing: 0.5px;
    }

    .btn-admin-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-admin-login:active {
        transform: translateY(0);
    }

    .alert-danger {
        background: #fee;
        border: 1px solid #fcc;
        color: #c33;
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .admin-footer {
        text-align: center;
        margin-top: 25px;
        color: #888;
        font-size: 13px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }

    @media (max-width: 480px) {
        .admin-login-card {
            padding: 30px 25px;
            margin: 15px;
        }
        
        .admin-card-title {
            font-size: 22px;
        }
    }
</style>

<div class="admin-login-container">
    <div class="admin-login-card">
        <img src="{% static 'assets/img/experts/logo.png' %}" 
             alt="Admin Logo" 
             class="admin-logo"
             onerror="this.style.display='none'">

        <h3 class="admin-card-title">Admin Login</h3>

        {% if error %}
            <div class="alert-danger">
                <i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-user" style="margin-right: 8px;"></i>
                    Username
                </label>
                <input type="text" 
                       name="username" 
                       class="form-control" 
                       placeholder="Enter your username"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock" style="margin-right: 8px;"></i>
                    Password
                </label>
                <input type="password" 
                       name="password" 
                       class="form-control" 
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit" class="btn-admin-login">
                <i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i>
                Login as Admin
            </button>
        </form>

        <div class="admin-footer">
            <p>Secure Admin Access Only</p>
        </div>
    </div>
</div>

{% endblock %}
