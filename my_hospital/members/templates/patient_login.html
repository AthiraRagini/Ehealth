{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    .login-bg {
        background: url("{% static 'assets/img/banner/emergency_2.jpg' %}") no-repeat center center/cover;
        min-height: calc(100vh - 120px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 0;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.25);  /* transparent white */
        backdrop-filter: blur(8px);             /* smooth blur */
        -webkit-backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.35);
    }
</style>

<div class="login-bg">
    <div class="col-md-5">
        <div class="glass-card shadow-lg">
            <h3 class="text-center mb-4">Patient Login</h3>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                </div>

                <button class="btn btn-primary w-100 mt-2">Login</button>
            </form>

            <p class="text-center mt-3">
                Don't have an account?
                <a href="{% url 'patient_register' %}">Register here</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
